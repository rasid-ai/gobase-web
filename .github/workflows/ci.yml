# Checks that run on a pull request (nothing merges without a human, and
# nothing merges red either).
#
# deploy.yml calls this same file via workflow_call before it builds, so a
# direct push to `dev` or a merge nobody tested as a combination is checked
# too — the PR gate is not the only thing standing between a commit and a VPS.
name: CI

on:
  pull_request:
  workflow_call:

jobs:
  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # pytest-django creates and drops its own test database, so this needs a
      # role that can CREATEDB — the stock postgres superuser.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-key
      DJANGO_DEBUG: "false"
      PORTAL_DB_NAME: portal
      PORTAL_DB_USER: portal
      PORTAL_DB_PASSWORD: portal
      PORTAL_DB_HOST: localhost
      PORTAL_DB_PORT: "5432"
      # `kb` is never connected to in tests — the alias mirrors `default`
      # (config/settings.py), which is what keeps docs/adr/002 true in CI.
      KB_DB_USER: portal
      KB_DB_PASSWORD: portal
      KB_DB_HOST: localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest

  frontend:
    name: Frontend — lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Before setup-node, which needs pnpm on PATH to resolve its cache. The
      # version comes from package.json's packageManager field, so CI and the
      # Docker image use the same pnpm.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  contract:
    name: Contract — openapi.yaml and the generated client are current
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Re-export the schema
        run: python manage.py spectacular --file openapi.yaml
        working-directory: backend

      - name: Fail if the committed contract drifted
        run: |
          git diff --exit-code -- openapi.yaml \
            || { echo "::error::backend/openapi.yaml is stale. Run: python manage.py spectacular --file openapi.yaml"; exit 1; }
        working-directory: backend

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Regenerate the client
        run: pnpm orval
        working-directory: frontend

      # Verified, never committed by CI: a bot commit on a protected branch
      # would walk straight past review.
      - name: Fail if the generated client drifted
        run: |
          git diff --exit-code -- src/api/generated \
            || { echo "::error::The Orval client is stale. Run: pnpm orval"; exit 1; }
          test -z "$(git status --porcelain -- src/api/generated)" \
            || { echo "::error::pnpm orval produced untracked files. Commit them."; git status --porcelain -- src/api/generated; exit 1; }
        working-directory: frontend
