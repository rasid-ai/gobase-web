      properties:
        index:
          type: integer
          readOnly: true
          description: The band's number, from 1.
        min:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Null when no pixel holds data.
        max:
          type: number
          format: double
          readOnly: true
          nullable: true
        mean:
          type: number
          format: double
          readOnly: true
          nullable: true
        valid_percent:
          type: number
          format: double
          readOnly: true
          description: The share of the place's pixels that hold data (not nodata),
            0 to 100.
      required:
      - index
      - max
      - mean
      - min
      - valid_percent
    RasterClass:
      type: object
      description: One class of a classified raster, inside the place.
      properties:
        value:
          type: integer
          readOnly: true
          description: The pixel value.
        name:
          type: string
          readOnly: true
          nullable: true
          description: The class's name from the raster's legend. Null when the legend
            has none.
        pixels:
          type: integer
          readOnly: true
        share:
          type: number
          format: double
          readOnly: true
          description: This class's part of the pixels that hold data, 0 to 1.
      required:
      - name
      - pixels
      - share
      - value
    RasterOtherClasses:
      type: object
      description: The classes left out of the list, as one sum.
      properties:
        values:
          type: integer
          readOnly: true
          description: How many values were left out.
        pixels:
          type: integer
          readOnly: true
        share:
          type: number
          format: double
          readOnly: true
          description: Their part of the pixels that hold data, 0 to 1.
      required:
      - pixels
      - share
      - values
    RasterStats:
      type: object
      description: |-
        What a raster's pixels say inside a place.

        What the Ask agent's `raster_clip` tool reads (docs/adr/024,
        docs/adr/029). Small on purpose: figures, never pixels. The pixels are a
        separate download, `clip.tif`.
      properties:
        asset_id:
          type: string
          format: uuid
          readOnly: true
        pixels:
          type: integer
          readOnly: true
          description: How many pixels are inside the place, on the grid that was
            read. 0 when the place misses the raster; there are then no figures.
        approximate:
          type: boolean
          readOnly: true
          description: 'True when the place holds more pixels than the server reads
            at once: it was then read at reduced size, so `pixels` counts that smaller
            grid and the figures and shares are close, not exact.'
        bands:
          type: array
          items:
            $ref: '#/components/schemas/RasterBandStats'
          readOnly: true
        classes:
          type: array
          items:
            $ref: '#/components/schemas/RasterClass'
          readOnly: true
          nullable: true
          description: 'For a classified raster (one whole-number band with a legend
            in its tags): the values found, largest share first, at most 256. Null
            for any other raster.'
        other_classes:
          allOf:
          - $ref: '#/components/schemas/RasterOtherClasses'
          readOnly: true
          nullable: true
          description: Every value beyond those in `classes`, summed, so the shares
            add up to 1. Null when `classes` holds them all, and for a raster that
            is not classified.
      required:
      - approximate
      - asset_id
      - bands
      - classes
      - other_classes
      - pixels
    RoleEnum:
      enum:
      - admin
      - viewer
      type: string
      description: |-
        * `admin` - Admin
        * `viewer` - Viewer
    Run:
      type: object
      description: One pipeline run, as the Runs list shows it.
      properties:
        id:
          type: string
          readOnly: true
        short_id:
          type: string
          readOnly: true
          description: First 8 characters of the id.
        job_name:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
          description: 'Dagster''s run status, passed through unchanged: QUEUED, NOT_STARTED,
            MANAGED, STARTING, STARTED, SUCCESS, FAILURE, CANCELING or CANCELED.'
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        ended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        duration_seconds:
          type: number
          format: double
          readOnly: true
          nullable: true
        trigger:
          allOf:
          - $ref: '#/components/schemas/Trigger'
          readOnly: true
        partition:
          type: string
          readOnly: true
          nullable: true
        steps_succeeded:
          type: integer
          readOnly: true
          nullable: true
        steps_failed:
          type: integer
          readOnly: true
          nullable: true
        materializations:
          type: integer
          readOnly: true
          nullable: true
        assets:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - assets
      - created_at
      - duration_seconds
      - ended_at
      - id
      - job_name
      - materializations
      - partition
      - short_id
      - started_at
      - status
      - steps_failed
      - steps_succeeded
      - trigger
    RunDetail:
      type: object
      description: One run with its per-step breakdown (specs/runs.md).
      properties:
        id:
          type: string
          readOnly: true
        short_id:
          type: string
          readOnly: true
          description: First 8 characters of the id.
        job_name:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
          description: 'Dagster''s run status, passed through unchanged: QUEUED, NOT_STARTED,
            MANAGED, STARTING, STARTED, SUCCESS, FAILURE, CANCELING or CANCELED.'
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        ended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        duration_seconds:
          type: number
          format: double
          readOnly: true
          nullable: true
        trigger:
          allOf:
          - $ref: '#/components/schemas/Trigger'
          readOnly: true
        partition:
          type: string
          readOnly: true
          nullable: true
        steps_succeeded:
          type: integer
          readOnly: true
          nullable: true
        steps_failed:
          type: integer
          readOnly: true
          nullable: true
        materializations:
          type: integer
          readOnly: true
          nullable: true
        assets:
          type: array
          items:
            type: string
          readOnly: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/RunTag'
          readOnly: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/RunStep'
          readOnly: true
        failure_summary:
          type: string
          readOnly: true
          nullable: true
          description: The first error in a failed run's log, or null. Null on a run
            that did not fail, and on one whose failure lies beyond the log scan.
      required:
      - assets
      - created_at
      - duration_seconds
      - ended_at
      - failure_summary
      - id
      - job_name
      - materializations
      - partition
      - short_id
      - started_at
      - status
      - steps
      - steps_failed
      - steps_succeeded
      - tags
      - trigger
    RunList:
      type: object
      description: |-
        A page of runs, newest first.

        `next_cursor` is the last run id of this page; pass it back as `cursor` to
        get the next one. It is null on the last page.
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Run'
          readOnly: true
        next_cursor:
          type: string
          readOnly: true
          nullable: true
      required:
      - next_cursor
      - results
    RunLogs:
      type: object
      description: A page of a run's event log, oldest first.
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/LogEvent'
          readOnly: true
        next_cursor:
          type: string
          readOnly: true
          nullable: true
        has_more:
          type: boolean
          readOnly: true
      required:
      - events
      - has_more
      - next_cursor
    RunStep:
      type: object
      description: |-
        One step of a run. Its status is a smaller enum than the run's: a step
        is only ever SKIPPED, SUCCESS, FAILURE or IN_PROGRESS.
      properties:
        step_key:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
          nullable: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        ended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        duration_seconds:
          type: number
          format: double
          readOnly: true
          nullable: true
      required:
      - duration_seconds
      - ended_at
      - started_at
      - status
      - step_key
    RunTag:
      type: object
      properties:
        key:
          type: string
          readOnly: true
        value:
          type: string
          readOnly: true
      required:
      - key
      - value
    SimilarAsset:
      type: object
      description: A list row, plus how well it matched and where its dataset is.
      properties:
        asset_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
          description: Derived from the asset's source path, extension removed — the
            catalog has no name column (docs/adr/010). A document is named after its
            PDF instead, extension kept (docs/adr/027).
        data_type:
          type: string
          readOnly: true
        format:
          type: string
          readOnly: true
          nullable: true
        dataset:
          type: string
          readOnly: true
          nullable: true
          description: 'The dataset''s name as the catalog holds it: a folder of the
            raw bucket.'
        dataset_label:
          type: string
          readOnly: true
          nullable: true
          description: 'The dataset''s name made readable: spaced and in sentence
            case.'
        topic_path:
          type: string
          readOnly: true
          nullable: true
        bytes:
          type: integer
          readOnly: true
          nullable: true
        bbox:
          type: array
          items:
            type: number
            format: double
          readOnly: true
          nullable: true
          description: The asset's coverage as [min_lon, min_lat, max_lon, max_lat],
            SRID 4326. Null when the asset has no coverage.
          maxItems: 4
          minItems: 4
        summary:
          type: string
          readOnly: true
          nullable: true
        time_start:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        time_end:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        ingested_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        document:
          allOf:
          - $ref: '#/components/schemas/Document'
          readOnly: true
          nullable: true
          description: Set for a document; null for every other data type.
        score:
          type: number
          format: double
          readOnly: true
          description: 'Cosine similarity between the question and the asset''s card:
            1 is identical. Bigger is better, and rows already come in that order.'
        dataset_bbox:
          type: array
          items:
            type: number
            format: double
          readOnly: true
          nullable: true
          description: The envelope of every active asset in this asset's dataset,
            as [min_lon, min_lat, max_lon, max_lat]. Null when none of them has coverage.
          maxItems: 4
          minItems: 4
      required:
      - asset_id
      - bbox
      - bytes
      - data_type
      - dataset
      - dataset_bbox
      - dataset_label
      - document
      - format
      - ingested_at
      - name
      - score
      - summary
      - time_end
      - time_start
      - topic_path
    SimilarAssets:
      type: object
      description: The closest matches to a question, best first.
      properties:
        embedder:
          type: string
          readOnly: true
          description: The model that embedded the question. Only the cards made by
            the same model are searched.
        results:
          type: array
          items:
            $ref: '#/components/schemas/SimilarAsset'
          readOnly: true
      required:
      - embedder
      - results
    Trigger:
      type: object
      description: |-
        What started a run. Dagster does not record this directly; it is read
        from the run's tags (context/integrations/dagster.md).
      properties:
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        name:
          type: string
          readOnly: true
          nullable: true
      required:
      - kind
      - name
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: '`Api-Key <key>`, for desktop clients. Read-only: any method other
        than GET, HEAD or OPTIONS is refused with 403 (docs/adr/021).'
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
