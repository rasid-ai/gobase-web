          readOnly: true
          description: 'The COG''s address on the lake, path-style: endpoint, bucket,
            key. Reading it takes the credentials; it is not a presigned link.'
        endpoint:
          type: string
          readOnly: true
          description: 'The lake as a desktop client reaches it: scheme, host and
            port.'
        region:
          type: string
          readOnly: true
          description: The region to sign for. The lake has no others.
        bucket:
          type: string
          readOnly: true
        key:
          type: string
          readOnly: true
          description: The object's key inside the bucket.
        credentials:
          allOf:
          - $ref: '#/components/schemas/LakeCredentials'
          readOnly: true
      required:
      - asset_id
      - bucket
