openapi: 3.0.3
info:
  title: Geo Portal API
  version: 0.1.0
  description: Internal API for the Geo Portal SPA. Read-only over the knowledge base.
paths:
  /api/auth/api-keys:
    post:
      operationId: auth_api_keys_create
      description: |-
        Exchange credentials for an API key.

        Checked exactly as login checks them, with the same single error message.
        No session is started: the client keeps the key, never the password.
      summary: Get an API key
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyIssueRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApiKeyIssueRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApiKeyIssueRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyIssued'
          description: ''
        '400':
          description: Incorrect username or password, or no name.
  /api/auth/change-password:
    post:
      operationId: auth_change_password_create
      description: Change the signed-in user's password.
      summary: Change password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '204':
          description: Password changed.
        '400':
          description: Current password incorrect, or new password rejected.
  /api/auth/login:
    post:
      operationId: auth_login_create
      description: Exchange credentials for a session.
      summary: Sign in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '400':
          description: Incorrect username or password.
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      description: 'End the session: blacklist the refresh token and drop the cookie.'
      summary: Sign out
      tags:
      - auth
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '204':
          description: Signed out.
  /api/auth/me:
    get:
      operationId: auth_me_retrieve
      description: Identity and role for the signed-in user.
      summary: Current user
      tags:
      - auth
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: |-
        Renew the session from the refresh cookie.

        The token comes from the cookie, never the request body — the SPA has no
        way to read it, which is the point.
      summary: Renew the session
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          description: Missing, expired, or revoked refresh credential.
  /api/catalog/assets:
    get:
      operationId: catalog_asset_list
      description: |-
        One page of the catalog, filtered and sorted.

        Both pages browse through here. The Assets page narrows it to a searched
        place, and the map's panel to a clicked point or a drawn area — one
        question with three geometries, and one answer to it, so the search, the
        datasets and the counts cannot differ between the two (docs/adr/016).
        What the place is compared with is the caller's to say: each asset's own
        coverage for the map, its dataset's for the Assets page (docs/adr/019).
      summary: Browse the asset catalog
      parameters:
      - in: query
        name: area
        schema:
          type: string
          minLength: 1
        description: 'Restrict to assets whose coverage overlaps this drawn polygon:
          WKT, POLYGON((lon lat, ...)), SRID 4326, at most 100 corners and not crossing
          itself.'
      - in: query
        name: bbox
        schema:
          type: string
          minLength: 1
        description: 'Restrict to assets whose coverage overlaps this area: min_lon,min_lat,max_lon,max_lat,
          SRID 4326. Not sent with a point or an area.'
      - in: query
        name: coverage
        schema:
          enum:
          - asset
          - dataset
          type: string
          default: asset
          minLength: 1
        description: |-
          What the place is compared with. `asset`: each asset's own coverage. `dataset`: its dataset's, the union of the coverage of the dataset's active assets, so every asset of a dataset that overlaps the place is included, those with no coverage of their own too. An asset with no dataset is compared by its own. Only matters with a place.

          * `asset` - asset
          * `dataset` - dataset
      - in: query
        name: data_type
        schema:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
        description: Repeatable. Omitted means every data type.
      - in: query
        name: dataset
        schema:
          type: string
          maxLength: 200
        description: Only assets in this dataset, matched exactly. Omitted means every
          dataset.
      - in: query
        name: ingested_after
        schema:
          type: string
          format: date-time
        description: Ingested at or after this moment.
      - in: query
        name: ingested_before
        schema:
          type: string
          format: date-time
        description: Ingested strictly before this moment.
      - in: query
        name: lat
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
        description: Latitude of the point, WGS 84. Sent with `lon`.
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
      - in: query
        name: lon
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
        description: 'Restrict to assets covering this point: longitude, WGS 84. Sent
          with `lat`.'
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: q
        schema:
          type: string
          maxLength: 200
        description: 'Case-insensitive, literal substring of the asset''s catalog
          text: its file name, dataset and dataset label, topic, format, data type,
          summary, layer names, vector column names and raster tag values.'
      - in: query
        name: sort
        schema:
          enum:
          - -ingested_at
          - -name
          - data_type
          - ingested_at
          - name
          type: string
          default: -ingested_at
          minLength: 1
        description: |-
          A leading minus reverses the order.

          * `-ingested_at` - -ingested_at
          * `-name` - -name
          * `data_type` - data_type
          * `ingested_at` - ingested_at
          * `name` - name
      tags:
      - catalog
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetList'
          description: ''
        '400':
          description: A filter that cannot be read, half a point, or more than one
            place.
  /api/catalog/assets/{asset_id}/pages/{page}.png:
    get:
      operationId: catalog_document_page
      description: |-
        One page of a document's PDF as an image, a passage drawn on it (docs/adr/020).

        The page is counted from 1, as the passages endpoint reports it. With
        `chunk`, the passage's boxes are drawn; without, the plain page. Read from
        bronze through the lake, like the PDF itself, and rendered here: the browser
        never sees the bucket, and an `<img>` cannot carry a token anyway.

        The ETag is the PDF's hash, the chunk, the page and the renderer's version,
        so a revalidation is a catalog lookup and neither a lake read nor a render.
      summary: A page of a document's PDF, with a passage marked
      parameters:
      - in: path
        name: asset_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: chunk
        schema:
          type: string
          minLength: 1
          pattern: ^(?!\.+$)[A-Za-z0-9._:-]{1,128}$
        description: 'A passage''s `chunk_id`: its boxes are drawn on the page. Omitted
          renders the plain page.'
      - in: path
        name: page
        schema:
          type: integer
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            image/png:
              schema:
                type: string
                format: binary
          description: ''
        '304':
          description: The ETag sent in If-None-Match still matches; use the copy
            already held.
        '400':
          description: A chunk id that is not one.
        '404':
          description: No active document with that id or no PDF recorded for it,
            a page it does not have, or a chunk that is not in it.
        '502':
          description: The PDF could not be read or rendered.
        '503':
          description: The lake or the chunk index could not be reached.
  /api/catalog/assets/{asset_id}/passages/{chunk_id}:
    get:
      operationId: catalog_document_passage
      description: |-
        One passage of a document, by its id: the text, its headings and its pages.

        What the Ask agent's `doc_read` tool calls to quote a passage exactly
        (docs/adr/024). Pages are counted from 1, as the passages endpoint reports
        them. The same read the page image does, without the image.
      summary: One passage of a document, by its id
      parameters:
      - in: path
        name: asset_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: chunk_id
        schema:
          type: string
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPassage'
          description: ''
        '400':
          description: A chunk id that is not one.
        '404':
          description: No active document with that id, a document with no passages
            indexed, or a chunk that is not in it.
        '502':
          description: The chunk index failed.
        '503':
          description: The chunk index could not be reached.
  /api/catalog/assets/{asset_id}/pdf:
    get:
      operationId: catalog_document_pdf
      description: |-
        The PDF behind one document, read from bronze.

        A document's `source_uri` is the parsed bundle in silver; the file a person
        wants to open is the PDF it was parsed from, which the data platform leaves
        in bronze and records in `doc_documents.pdf_uri`. The bytes come through
        here rather than through a link into the bucket because the browser never
        talks to the lake (docs/adr/011, docs/adr/027).

        Served whole and uncompressed — a PDF is already compressed — with a strong
        ETag: `content_hash` is the PDF's own sha256, so a revalidation is a
        catalog lookup and never a lake read. The client opens it in a new tab, so
        the body is `inline` and carries the file's name.
      summary: A document's PDF
      parameters:
      - in: path
        name: asset_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
        '304':
          description: The ETag sent in If-None-Match still matches; use the copy
            already held.
        '404':
          description: No active document with that id, or one whose PDF the catalog
            does not record.
        '502':
          description: The PDF could not be read.
        '503':
          description: The lake could not be reached.
  /api/catalog/assets/similar:
    get:
      operationId: catalog_similar_assets
      description: |-
        The assets whose card is closest in meaning to a question.

        The map's Semantic mode (docs/adr/018). The question is embedded by the
        data platform's document service — the model that embedded the cards —
        and the catalog ranks its cards by cosine similarity. Cards only, in
        Postgres: the shallow search, never the chunk index. Meaning only: no
        place narrows it yet.
      summary: Assets matching a question
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 500
        description: What you are looking for, in words. Embedded as typed and matched
          against the catalog's cards by meaning, not by text.
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarAssets'
          description: ''
        '400':
          description: Missing or empty text, or a limit out of range.
        '502':
          description: The embedding service refused the question.
        '503':
          description: The embedding service is unreachable, or no URL is set for
            it.
  /api/catalog/datasets:
    get:
      operationId: catalog_dataset_list
      description: |-
        The datasets holding matching assets, and how many of each type.

        The first step of browsing by dataset, on both pages: pick one here, then
        list its assets with `dataset=` on the asset list, sending the same place,
        coverage and window so the count shown here is the count found there.
      summary: Datasets in the catalog
      parameters:
      - in: query
        name: area
        schema:
          type: string
          minLength: 1
        description: 'Restrict to assets whose coverage overlaps this drawn polygon:
          WKT, POLYGON((lon lat, ...)), SRID 4326, at most 100 corners and not crossing
          itself.'
      - in: query
        name: bbox
        schema:
          type: string
          minLength: 1
        description: 'Restrict to assets whose coverage overlaps this area: min_lon,min_lat,max_lon,max_lat,
          SRID 4326. Not sent with a point or an area.'
      - in: query
        name: coverage
        schema:
          enum:
          - asset
          - dataset
          type: string
          default: asset
          minLength: 1
        description: |-
          What the place is compared with. `asset`: each asset's own coverage. `dataset`: its dataset's, the union of the coverage of the dataset's active assets, so every asset of a dataset that overlaps the place is included, those with no coverage of their own too. An asset with no dataset is compared by its own. Only matters with a place.

          * `asset` - asset
          * `dataset` - dataset
      - in: query
        name: ingested_after
        schema:
          type: string
          format: date-time
        description: Ingested at or after this moment.
      - in: query
        name: ingested_before
        schema:
          type: string
          format: date-time
        description: Ingested strictly before this moment.
      - in: query
        name: lat
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
        description: Latitude of the point, WGS 84. Sent with `lon`.
      - in: query
        name: lon
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
        description: 'Restrict to assets covering this point: longitude, WGS 84. Sent
          with `lat`.'
      - in: query
        name: q
        schema:
          type: string
          maxLength: 200
        description: Case-insensitive, literal substring of the dataset's name or
          its readable label. Its files' metadata is not searched.
      tags:
      - catalog
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetList'
          description: ''
        '400':
          description: A filter that cannot be read, half a point, or more than one
            place.
  /api/catalog/passages:
    get:
      operationId: catalog_passages
      description: |-
        The documents whose passages best answer a question (docs/adr/020).

        The Assets page's Semantic search. The question is embedded by the data
        platform's document service, the catalog names the documents in scope —
        narrowed by place, window and dataset like any browse — and the chunk
        index ranks their passages. Deep, where `assets/similar` is shallow.
      summary: Passages answering a question
      parameters:
      - in: query
        name: area
        schema:
          type: string
          minLength: 1
        description: 'Restrict to assets whose coverage overlaps this drawn polygon:
          WKT, POLYGON((lon lat, ...)), SRID 4326, at most 100 corners and not crossing
          itself.'
      - in: query
        name: asset_id
        schema:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10
        description: Only these documents, within the other filters. Repeat the parameter
          for several, up to 10 (docs/adr/031).
      - in: query
        name: bbox
        schema:
          type: string
          minLength: 1
        description: 'Restrict to assets whose coverage overlaps this area: min_lon,min_lat,max_lon,max_lat,
          SRID 4326. Not sent with a point or an area.'
      - in: query
        name: coverage
        schema:
          enum:
          - asset
          - dataset
          type: string
          default: asset
          minLength: 1
        description: |-
          What the place is compared with. `asset`: each asset's own coverage. `dataset`: its dataset's, the union of the coverage of the dataset's active assets, so every asset of a dataset that overlaps the place is included, those with no coverage of their own too. An asset with no dataset is compared by its own. Only matters with a place.

          * `asset` - asset
          * `dataset` - dataset
      - in: query
        name: dataset
        schema:
          type: string
          maxLength: 200
        description: Only documents in this dataset, matched exactly. Omitted means
          every dataset.
      - in: query
        name: ingested_after
        schema:
          type: string
          format: date-time
        description: Ingested at or after this moment.
      - in: query
        name: ingested_before
        schema:
          type: string
          format: date-time
        description: Ingested strictly before this moment.
      - in: query
        name: lat
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
        description: Latitude of the point, WGS 84. Sent with `lon`.
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
        description: The most documents to return.
      - in: query
        name: lon
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
        description: 'Restrict to assets covering this point: longitude, WGS 84. Sent
          with `lat`.'
      - in: query
        name: passages
        schema:
          type: integer
          maximum: 10
          minimum: 1
          default: 3
        description: The most passages per document.
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 500
        description: What you are looking for, in words. Embedded as typed and matched
          against the documents' passages by meaning, not by text.
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passages'
          description: ''
        '400':
          description: Missing or empty text, a limit out of range, or a bad place.
        '502':
          description: The embedding service refused the question, or the index failed.
        '503':
          description: The embedding service is unreachable or not configured, or
            the index could not be reached.
  /api/chat/sessions:
    get:
      operationId: chat_session_list
      summary: The signed-in user's chat sessions, newest first
      tags:
      - chat
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionList'
          description: ''
        '502':
          description: The agent refused, or answered outside the contract.
        '503':
          description: The agent is unreachable, or no AGENT_URL is set.
  /api/chat/sessions/{session_id}:
    get:
      operationId: chat_session_retrieve
      summary: One chat session with every question and answer, oldest first
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionDetail'
          description: ''
        '404':
          description: The signed-in user has no such session.
        '502':
          description: The agent refused, or answered outside the contract.
        '503':
          description: The agent is unreachable, or no AGENT_URL is set.
    delete:
      operationId: chat_session_delete
      summary: Delete one chat session
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '204':
          description: Deleted.
        '404':
          description: The signed-in user has no such session.
        '502':
          description: The agent refused, or answered outside the contract.
        '503':
          description: The agent is unreachable, or no AGENT_URL is set.
  /api/chat/sessions/{session_id}/turns:
    post:
      operationId: chat_turn_create
      description: An unknown session id starts a new session, so the client names
        a new session by choosing a fresh UUID.
      summary: Ask one question in a session, and stream the answer
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskTurnRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatTurnEvent'
          description: Server-sent events. Each `data:` line is one ChatTurnEvent
            as JSON. The last is `done` for a whole answer or `error` for one that
            stopped part-way; `step`, `text` and `reference` come before it, in any
            number.
        '400':
          description: The question or the map context is not valid.
        '502':
          description: The agent refused, or answered outside the contract.
        '503':
          description: The agent is unreachable, or no AGENT_URL is set.
  /api/health/:
    get:
      operationId: health_retrieve
      description: Report whether this container can serve requests against `portal`.
      summary: Health check
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          description: The portal database is unreachable.
  /api/map/assets/{asset_id}:
    get:
      operationId: map_asset_detail
      description: One asset's metadata and footprint.
      summary: Asset metadata and footprint
      parameters:
      - in: path
        name: asset_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - map
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetail'
          description: ''
        '404':
          description: No active asset with that id.
  /api/map/assets/{asset_id}/clip.tif:
    get:
      operationId: map_asset_raster_clip
      description: |-
        One raster's pixels over a place, as a GeoTIFF to download.

        The window over the place's envelope, in the raster's own CRS and on its
        own grid, with its nodata, colours and legend (docs/adr/029). A rectangle,
        never a polygon mask: a drawn area is clipped to its envelope. The
        response is held whole, so it is capped by size, not by pixel count: a window whose
        pixels come to more than `RASTER_CLIP_MAX_BYTES` before compression
        (width x height x bands x bytes per value) is a 400 that says how large
        it was. The whole raster is not a clip; a desktop client reads it
        through `raster-access`.

        Cached as the document PDF is: an ETag and `private, no-cache`, so a
        browser keeps the file and asks before reusing it, and a match is a 304
        with no lake read. A HEAD request answers with the same status and
        headers a GET would, from the raster's header alone: it builds no clip,
        so its `Content-Length` is 0 and not the file's.

        Raster only: any other asset is a 404.
      summary: A raster clipped to a place, as a GeoTIFF
      parameters:
      - in: query
        name: area
        schema:
          type: string
          minLength: 1
        description: 'A drawn polygon: WKT, POLYGON((lon lat, ...)), SRID 4326, at
          most 100 corners and not crossing itself. Sent instead of bbox. For raster-stats,
          only the pixels whose centre is inside it are counted. For clip.tif, the
          pixels over its envelope are returned: a clip is a rectangle, never a polygon
          mask.'
      - in: path
        name: asset_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: bbox
        schema:
          type: string
          minLength: 1
        description: 'A rectangle: min_lon,min_lat,max_lon,max_lat, SRID 4326. For
          raster-stats, only the pixels whose centre is inside it are counted, and
          without bbox or area the whole raster is. For clip.tif, the pixels over
          it are returned.'
      tags:
      - map
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            image/tiff:
              schema:
                type: string
                format: binary
          description: ''
        '304':
          description: The ETag sent in If-None-Match still matches; use the copy
            already held.
        '400':
          description: An unreadable bbox or area, both, or neither; a place that
            does not overlap the raster; or a place too large to clip (the message
            says how large its pixels are, uncompressed, and how large a clip may
            be).
        '404':
          description: No active raster asset with that id.
        '422':
          description: 'No place can be put on this raster: its extent has no longitude
            and latitude box. The message says so.'
        '502':
          description: The raster could not be read.
        '503':
          description: The lake could not be reached, the read ran past its time limit,
            or the portal could not write the clip to its own disk.
  /api/map/assets/{asset_id}/data:
    get:
      operationId: map_asset_data
      description: |-
        One vector asset's features, read from the lake.

        Vector only, and the endpoint says so rather than inferring it: `assets`
        holds every modality and the lake read only makes sense for GeoParquet
        (docs/adr/008). Other modalities get their own endpoints.

        The one endpoint that writes its own body instead of going through DRF's
        renderer, and the one that is compressed and cached (docs/adr/015). A page
        is megabytes of GeoJSON that DuckDB has already written, so rendering it
        again would only parse and re-serialise it. `AssetDataSerializer` still
        declares its shape to the contract.

        Compressed here, not site-wide: Django's middleware also compresses
        streaming responses, which would hold back the server-sent events the Ask
        slice will use, and compressing only this keeps it away from any response
        that carries a secret (BREACH). See `_compressed` for why not Django's own
        `gzip_page` either.
      summary: Vector asset features
      parameters:
      - in: query
        name: area
        schema:
          type: string
          minLength: 1
        description: 'Read only the features that intersect this drawn polygon: WKT,
          POLYGON((lon lat, ...)), SRID 4326, at most 100 corners and not crossing
          itself. Matching is exact. Sent instead of bbox.'
      - in: path
        name: asset_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: bbox
        schema:
          type: string
          minLength: 1
        description: 'Read only the features whose bounding box overlaps this area:
          min_lon,min_lat,max_lon,max_lat, SRID 4326. Matching is on bounding boxes,
          so a feature just outside the area may be included. Without it the whole
          file is in scope.'
      - in: query
        name: cursor
        schema:
          type: integer
          minimum: 0
        description: The `next_cursor` of the previous page.
      - in: query
        name: filter_column
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: Keep only the features whose value in this column matches. A
          column of the asset, as its metadata lists them. Sent with filter_op and
          filter_value.
      - in: query
        name: filter_op
        schema:
          enum:
          - equals
          - contains
          - in
          - <
          - '>'
          type: string
          minLength: 1
        description: |-
          How to compare. `equals` and `in`: text without regard to case, other types by value. `contains`: text columns only, without regard to case. `<` and `>`: numbers, dates and timestamps only. A null never matches.

          * `equals` - equals
          * `contains` - contains
          * `in` - in
          * `<` - <
          * `>` - >
      - in: query
        name: filter_value
        schema:
          type: array
          items:
            type: string
            maxLength: 200
          maxItems: 20
        description: The value to compare with, as text. Repeat the parameter to give
          `in` several, up to 20; every other operator takes one.
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
        description: Features per page. Defaults to, and is capped at, the server's
          page size.
      tags:
      - map
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetData'
          description: ''
        '304':
          description: The ETag sent in If-None-Match still matches; use the copy
            already held. A browser handles this itself and hands the client its cached
            200.
        '400':
          description: 'An unreadable bbox, area, cursor or limit, both bbox and area,
            or a filter the asset cannot take: an unknown column (the message lists
            the real ones), an operator its type does not allow, or a value that is
            not of its type.'
        '404':
          description: No active vector asset with that id.
        '502':
          description: The file could not be read.
        '503':
          description: The lake could not be reached.
  /api/map/assets/{asset_id}/raster-access:
    get:
      operationId: map_asset_raster_access
      description: |-
        Short-lived, read-only lake credentials for one raster, and its address.

        ArcGIS Pro cannot open a COG from a URL. It reads one through a cloud
        storage connection, which signs its own range requests to the bucket, so
        the portal hands out what that connection needs and never the pixels
        (docs/adr/022). Raster only: any other asset is a 404, as `/data` is for
        anything but a vector.

        A GET although each call issues new credentials: an API key may only
        read (docs/adr/021), and nothing in the portal or the lake changes.
      summary: Credentials to read a raster from the lake
      parameters:
      - in: path
        name: asset_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - map
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RasterAccess'
          description: ''
        '404':
          description: No active raster asset with that id.
        '502':
          description: The lake answered with an error, or the raster is not in the
            lake.
        '503':
          description: Raster access is not set up on this portal, or the lake could
            not be reached.
  /api/map/assets/{asset_id}/raster-stats:
    get:
      operationId: map_asset_raster_stats
      description: |-
        What one raster's pixels say inside a place: band figures and class shares.

        For answers (docs/adr/029). The portal reads only the window over the
        place, a chunk of rows at a time, and counts at most
        `RASTER_STATS_MAX_PIXELS`: a larger place is read at reduced size and
        the answer says `approximate`. The body is figures, never pixels. Raster
        only: any other asset is a 404. A raster no place can be put on is a 422
        that says so; with no place it is still measured whole.

        A place that misses the raster is a 200 with `pixels: 0`: the honest
        answer to "what is here" is "nothing", not an error.
      summary: Raster statistics over a place
      parameters:
      - in: query
        name: area
        schema:
          type: string
          minLength: 1
        description: 'A drawn polygon: WKT, POLYGON((lon lat, ...)), SRID 4326, at
          most 100 corners and not crossing itself. Sent instead of bbox. For raster-stats,
          only the pixels whose centre is inside it are counted. For clip.tif, the
          pixels over its envelope are returned: a clip is a rectangle, never a polygon
          mask.'
      - in: path
        name: asset_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: bbox
        schema:
          type: string
          minLength: 1
        description: 'A rectangle: min_lon,min_lat,max_lon,max_lat, SRID 4326. For
          raster-stats, only the pixels whose centre is inside it are counted, and
          without bbox or area the whole raster is. For clip.tif, the pixels over
          it are returned.'
      tags:
      - map
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RasterStats'
          description: ''
        '400':
          description: An unreadable bbox or area, or both.
        '404':
          description: No active raster asset with that id.
        '422':
          description: 'No place can be put on this raster: its extent has no longitude
            and latitude box. The message says so.'
        '502':
          description: The raster could not be read.
        '503':
          description: The lake could not be reached, or the read ran past its time
            limit.
  /api/map/assets/{asset_id}/summary:
    get:
      operationId: map_asset_summary
      description: |-
        How many of a vector asset's features are in a place, and a few of them.

        For answers, where `/data` is for drawing (docs/adr/028). The count is
        exact, for a rectangle as for a drawn polygon, and takes the same
        attribute filter `/data` does. A layer drawn with the same `area` and
        filter shows the features that were counted; `/data` tests a `bbox` by
        bounding boxes, so there it may show a few more. What the Ask agent's
        `vector_features` tool calls (docs/adr/024), always with an `area`.

        Vector only, like `/data`. A small body through DRF's renderer: nothing
        here needs `/data`'s compression or its ETag.
      summary: Vector asset feature count and sample
      parameters:
      - in: query
        name: area
        schema:
          type: string
          minLength: 1
        description: 'Count only the features that intersect this drawn polygon: WKT,
          POLYGON((lon lat, ...)), SRID 4326, at most 100 corners and not crossing
          itself. Sent instead of bbox.'
      - in: path
        name: asset_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: bbox
        schema:
          type: string
          minLength: 1
        description: 'Count only the features that intersect this rectangle: min_lon,min_lat,max_lon,max_lat,
          SRID 4326. Exact: a feature whose bounding box overlaps it but whose shape
          does not is left out. Without bbox or area the whole file is counted.'
      - in: query
        name: filter_column
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: Keep only the features whose value in this column matches. A
          column of the asset, as its metadata lists them. Sent with filter_op and
          filter_value.
      - in: query
        name: filter_op
        schema:
          enum:
          - equals
          - contains
          - in
          - <
          - '>'
          type: string
          minLength: 1
        description: |-
          How to compare. `equals` and `in`: text without regard to case, other types by value. `contains`: text columns only, without regard to case. `<` and `>`: numbers, dates and timestamps only. A null never matches.

          * `equals` - equals
          * `contains` - contains
          * `in` - in
          * `<` - <
          * `>` - >
      - in: query
        name: filter_value
        schema:
          type: array
          items:
            type: string
            maxLength: 200
          maxItems: 20
        description: The value to compare with, as text. Repeat the parameter to give
          `in` several, up to 20; every other operator takes one.
      - in: query
        name: sample
        schema:
          type: integer
          maximum: 10
          minimum: 0
          default: 5
        description: How many matching rows to return as a sample, in file order.
      tags:
      - map
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetSummary'
          description: ''
        '400':
          description: 'An unreadable bbox, area or sample, both bbox and area, or
            a filter the asset cannot take: an unknown column (the message lists the
            real ones), an operator its type does not allow, or a value that is not
            of its type.'
        '404':
          description: No active vector asset with that id.
        '502':
          description: The file could not be read.
        '503':
          description: The lake could not be reached.
  /api/places/search:
    get:
      operationId: places_search
      description: Find places by name or address.
      summary: Search for a place by name or address
      parameters:
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 200
        description: A place name or address, as one line.
        required: true
      tags:
      - places
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceSearch'
          description: ''
        '400':
          description: Missing or empty search text.
        '502':
          description: The geocoder returned an error.
        '503':
          description: The geocoder is unreachable, or no API key is set.
  /api/runs/:
    get:
      operationId: runs_list
      description: List pipeline runs, newest first.
      summary: Pipeline runs
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: The previous page's next_cursor.
      - in: query
        name: job
        schema:
          type: string
        description: Filter to one job name.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size, 1-100. Defaults to 25.
      - in: query
        name: status
        schema:
          type: string
        description: Comma-separated run statuses, e.g. SUCCESS,FAILURE.
      tags:
      - runs
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
          description: ''
        '400':
          description: Unknown run status, or a bad limit.
        '502':
          description: Dagster returned an error.
        '503':
          description: Dagster is unreachable.
  /api/runs/{run_id}:
    get:
      operationId: runs_detail
      description: One run, with its per-step breakdown.
      summary: Run detail and steps
