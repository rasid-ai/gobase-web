openapi: 3.0.3
info:
  title: Geo Portal API
  version: 0.1.0
  description: Internal API for the Geo Portal SPA. Read-only over the knowledge base.
paths:
  /api/auth/change-password:
    post:
      operationId: auth_change_password_create
      description: Change the signed-in user's password.
      summary: Change password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Password changed.
        '400':
          description: Current password incorrect, or new password rejected.
  /api/auth/login:
    post:
      operationId: auth_login_create
      description: Exchange credentials for a session.
      summary: Sign in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '400':
          description: Incorrect username or password.
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      description: 'End the session: blacklist the refresh token and drop the cookie.'
      summary: Sign out
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Signed out.
  /api/auth/me:
    get:
      operationId: auth_me_retrieve
      description: Identity and role for the signed-in user.
      summary: Current user
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: |-
        Renew the session from the refresh cookie.

        The token comes from the cookie, never the request body — the SPA has no
        way to read it, which is the point.
      summary: Renew the session
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          description: Missing, expired, or revoked refresh credential.
  /api/health/:
    get:
      operationId: health_retrieve
      description: Report whether this container can serve requests against `portal`.
      summary: Health check
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          description: The portal database is unreachable.
  /api/map/assets:
    get:
      operationId: map_assets_at_point
      description: List the catalog assets whose coverage includes a point.
      summary: Assets covering a point
      parameters:
      - in: query
        name: lat
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
        required: true
      - in: query
        name: lon
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
        required: true
      tags:
      - map
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetsAtPoint'
          description: ''
        '400':
          description: Missing or out-of-range coordinates.
  /api/map/assets/{asset_id}:
    get:
      operationId: map_asset_detail
      description: One asset's metadata and footprint.
      summary: Asset metadata and footprint
      parameters:
      - in: path
        name: asset_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - map
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetail'
          description: ''
        '404':
          description: No active asset with that id.
components:
  schemas:
    AccessToken:
      type: object
      description: |-
        Login and refresh both return only the access token.

        The refresh token is never in a response body — it is set as an httpOnly
        cookie by the view.
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    AssetDetail:
      type: object
      description: One asset's dynamic metadata and its footprint.
      properties:
        asset_id:
          type: string
          format: uuid
          readOnly: true
        data_type:
          type: string
          readOnly: true
        metadata:
          type: object
          additionalProperties: {}
          readOnly: true
          description: Whatever the catalog holds for this asset. The key set is not
            fixed and differs by data type.
        footprint:
          readOnly: true
          description: The asset's coverage as a GeoJSON geometry, SRID 4326.
      required:
      - asset_id
      - data_type
      - footprint
      - metadata
    AssetGroup:
      type: object
      description: |-
        Assets sharing a data type.

        The data type is whatever the knowledge base classifies the asset as; the
        portal neither defines nor translates the list (specs/map.md).
      properties:
        data_type:
          type: string
          readOnly: true
        assets:
          type: array
          items:
            $ref: '#/components/schemas/AssetSummary'
          readOnly: true
      required:
      - assets
      - data_type
    AssetSummary:
      type: object
      description: One asset as it appears in a point-click list.
      properties:
        asset_id:
          type: string
          format: uuid
          readOnly: true
        source_uri:
          type: string
          readOnly: true
        format:
          type: string
          readOnly: true
          nullable: true
        summary:
          type: string
          readOnly: true
          nullable: true
        time_start:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        time_end:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - asset_id
      - format
      - source_uri
      - summary
      - time_end
      - time_start
    AssetsAtPoint:
      type: object
      description: The whole answer to a point click. No coverage means no groups.
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/AssetGroup'
          readOnly: true
      required:
      - groups
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - new_password
    Health:
      type: object
      properties:
        status:
          type: string
          readOnly: true
      required:
      - status
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    Me:
      type: object
      properties:
        username:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
      required:
      - role
      - username
    RoleEnum:
      enum:
      - admin
      - viewer
      type: string
      description: |-
        * `admin` - Admin
        * `viewer` - Viewer
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
