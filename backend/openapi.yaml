        text:
          type: string
          readOnly: true
        heading_path:
          type: array
          items:
            type: string
          readOnly: true
          description: The section headings above the passage, outermost first. Empty
            when none.
        page_start:
          type: integer
          readOnly: true
          nullable: true
          description: The page the passage starts on, as a reader counts them, from
            1 — the number `/pages/{page}.png` and a PDF viewer's `#page=` take. The
