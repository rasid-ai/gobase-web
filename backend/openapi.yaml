          readOnly: true
          nullable: true
        dataset:
          type: string
          readOnly: true
          nullable: true
          description: 'The dataset''s name as the catalog holds it: a folder of the
            raw bucket.'
        dataset_label:
          type: string
          readOnly: true
          nullable: true
          description: 'The dataset''s name made readable: spaced and in sentence
            case.'
        topic_path:
          type: string
          readOnly: true
          nullable: true
        bytes:
          type: integer
          readOnly: true
          nullable: true
        bbox:
          type: array
          items:
            type: number
            format: double
          readOnly: true
          nullable: true
