components:
  schemas:
    AccessToken:
      type: object
      description: |-
        Login and refresh both return only the access token.

        The refresh token is never in a response body — it is set as an httpOnly
        cookie by the view.
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    ApiKeyIssueRequest:
      type: object
      description: Credentials, checked as login checks them, plus a name for the
        new key.
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        name:
          type: string
          writeOnly: true
          minLength: 1
          description: Names the computer, e.g. “ArcGIS Pro on DESKTOP-6NHTMEV”. The
            user's other live keys of this name are revoked.
          maxLength: 100
      required:
      - name
      - password
      - username
    ApiKeyIssued:
      type: object
      properties:
        key:
          type: string
          readOnly: true
          description: 'Send as `Authorization: Api-Key <key>`. Shown only here.'
        prefix:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - key
      - name
      - prefix
    AskContextRequest:
      type: object
      description: |-
        The map's state when the question was asked, as data rather than prose.

        Every field is optional. The agent reads it as what "here" means: the
        model picks a scope by name and the agent's tools take the geometry from
        here, so the model never copies coordinates (docs/adr/023).
      properties:
        viewport:
          type: array
          items:
            type: number
            format: double
          description: 'What the map shows: [min_lon, min_lat, max_lon, max_lat],
            SRID 4326.'
          maxItems: 4
          minItems: 4
        point:
          type: array
          items:
            type: number
            format: double
          description: 'A clicked point: [lon, lat], SRID 4326.'
          maxItems: 2
          minItems: 2
        area:
          type: string
          minLength: 1
          description: 'A drawn polygon as WKT, POLYGON((lon lat, lon lat, ...)),
            SRID 4326. Checked as the catalog checks it: one ring, closed, never crossing
            itself.'
        asset_id:
          type: string
          format: uuid
          description: The asset selected in the map's panel.
    AskTurnRequestRequest:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          description: The question, in any language.
          maxLength: 4000
        context:
          $ref: '#/components/schemas/AskContextRequest'
      required:
      - prompt
    AssetData:
      type: object
      description: |-
        A vector asset's features, read from the lake.

        There is no serializer for a feature: its properties are whatever columns
        the GeoParquet file holds, and they differ per file. The shape is declared
        to the contract instead, by `FeatureListField`, so the generated client
        still gets a typed array rather than `unknown[]`.
      properties:
        asset_id:
          type: string
          format: uuid
          readOnly: true
        count:
          type: integer
          readOnly: true
          description: How many features are in this response.
        next_cursor:
          type: integer
          readOnly: true
          nullable: true
          description: Pass back as `cursor` for the next page of this area. Null
            when this page is the last.
        features:
          type: array
          items:
            type: object
            title: Feature
            properties:
              type:
                type: string
                enum:
                - Feature
              geometry:
                type: object
                nullable: true
                additionalProperties: true
                description: A GeoJSON geometry, SRID 4326.
              properties:
                type: object
                additionalProperties: true
                description: The file's non-geometry columns.
            required:
            - type
            - geometry
            - properties
          readOnly: true
          description: GeoJSON Features, SRID 4326.
      required:
      - asset_id
      - count
      - features
      - next_cursor
    AssetDetail:
      type: object
      description: One asset's dynamic metadata and its footprint.
      properties:
        asset_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
          description: Derived from the asset's source path, extension removed — the
            same name the catalog list shows (docs/adr/010).
        data_type:
          type: string
          readOnly: true
        metadata:
          type: object
          additionalProperties: {}
          readOnly: true
          description: Whatever the catalog holds for this asset. The key set is not
            fixed and differs by data type.
        footprint:
          readOnly: true
          description: The asset's coverage as a GeoJSON geometry, SRID 4326.
      required:
      - asset_id
      - data_type
      - footprint
      - metadata
      - name
    AssetList:
      type: object
      description: One page of the catalog.
      properties:
        count:
          type: integer
          readOnly: true
          description: How many assets match, ignoring limit and offset.
        results:
          type: array
          items:
            $ref: '#/components/schemas/AssetListItem'
          readOnly: true
        data_type_counts:
          type: array
          items:
            $ref: '#/components/schemas/DataTypeCount'
          readOnly: true
          description: Counts per data type for the current filters, ignoring the
            data_type selection itself.
      required:
      - count
      - data_type_counts
      - results
    AssetListItem:
      type: object
      description: |-
        One asset as the catalog browse list shows it.

        Every field is declared, unlike the map's asset detail: a list shows the
        same columns for every row, so a value the catalog does not hold is null
        rather than a missing key.
      properties:
        asset_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
          description: Derived from the asset's source path, extension removed — the
            catalog has no name column (docs/adr/010). A document is named after its
            PDF instead, extension kept (docs/adr/027).
        data_type:
          type: string
          readOnly: true
        format:
          type: string
          readOnly: true
          nullable: true
        dataset:
          type: string
          readOnly: true
          nullable: true
          description: 'The dataset''s name as the catalog holds it: a folder of the
            raw bucket.'
        dataset_label:
          type: string
          readOnly: true
          nullable: true
          description: 'The dataset''s name made readable: spaced and in sentence
            case.'
        topic_path:
          type: string
          readOnly: true
          nullable: true
        bytes:
          type: integer
          readOnly: true
          nullable: true
        bbox:
          type: array
          items:
            type: number
            format: double
          readOnly: true
          nullable: true
          description: The asset's coverage as [min_lon, min_lat, max_lon, max_lat],
            SRID 4326. Null when the asset has no coverage.
          maxItems: 4
          minItems: 4
        summary:
          type: string
          readOnly: true
          nullable: true
        time_start:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        time_end:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        ingested_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        document:
          allOf:
          - $ref: '#/components/schemas/Document'
          readOnly: true
          nullable: true
          description: Set for a document; null for every other data type.
      required:
      - asset_id
      - bbox
      - bytes
      - data_type
      - dataset
      - dataset_label
      - document
      - format
      - ingested_at
      - name
      - summary
      - time_end
      - time_start
      - topic_path
    AssetSummary:
      type: object
      description: |-
        How many of a vector asset's features match, and what a few of them hold.

        What the Ask agent's `vector_features` tool reads (docs/adr/024,
        docs/adr/028). Small on purpose: a count and a few rows of properties, no
        geometry. The features themselves are drawn from `/data` with the same
        place and filter.
      properties:
        asset_id:
          type: string
          format: uuid
          readOnly: true
        total:
          type: integer
          readOnly: true
          description: The exact number of features inside the place, filter applied.
        sample:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
          description: 'The properties of the first matching features in file order:
            the file''s non-geometry columns, as `/data` writes them.'
      required:
      - asset_id
      - sample
      - total
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - new_password
    ChatDoneEvent:
      type: object
      description: The whole answer, checked by the agent. The last event of a whole
        answer.
      properties:
        event:
          allOf:
          - $ref: '#/components/schemas/ChatDoneEventEventEnum'
          description: |-
            What this event is.

            * `done` - done
        text:
          type: string
        references:
          type: array
          items:
            $ref: '#/components/schemas/ChatReference'
      required:
      - event
      - references
      - text
    ChatDoneEventEventEnum:
      enum:
      - done
      type: string
      description: '* `done` - done'
    ChatErrorEvent:
      type: object
      description: |-
        The answer stopped part-way. The last event of an incomplete answer.

        What streamed before it stays on screen, marked incomplete; it is never
        shown as a whole answer. The session stays usable for the next question.
      properties:
        event:
          allOf:
          - $ref: '#/components/schemas/ChatErrorEventEventEnum'
          description: |-
            What this event is.

            * `error` - error
        message:
          type: string
        incomplete:
          type: boolean
      required:
      - event
      - incomplete
      - message
    ChatErrorEventEventEnum:
      enum:
      - error
      type: string
      description: '* `error` - error'
    ChatFilter:
      type: object
      description: |-
        A simple attribute filter: one column, one operator, one value (docs/adr/024).

        Not free SQL and not group-by. The backend binds the value as a parameter
        wherever it applies one.
      properties:
        column:
          type: string
          description: A column the asset has.
        op:
          $ref: '#/components/schemas/ChatFilterOpEnum'
        value:
          description: A string or a number; a list of them for `in`.
      required:
      - column
      - op
      - value
    ChatFilterOpEnum:
      enum:
      - equals
      - contains
      - in
      - <
      - '>'
      type: string
      description: |-
        * `equals` - equals
        * `contains` - contains
        * `in` - in
        * `<` - <
        * `>` - >
    ChatReference:
      type: object
      description: |-
        Something an answer points to besides its text.

        It carries only what the SPA needs to show it through this backend's
        existing endpoints — never features, pixels or PDF bytes (docs/adr/024).
        Which fields are set depends on `kind`:

        - `asset`: `asset_id` — an asset the answer names.
        - `layer`: `asset_id`, `area` or `bbox`, `filter`, `total` — vector
          features to draw from `/api/map/assets/{id}/data`.
        - `passage`: `asset_id`, `chunk_id`, `page` — a passage of a document.
        - `raster`: `asset_id`, `area` or `bbox`, `stats` — figures read from a
          raster over an area.
        - `frame`: `bbox` — where the map should look.

        Every kind may also carry `handle`, the agent's short name for the item
        (`A1`, `P1`), which the answer cites inline as `[A1]`, plus the asset's
        `name` and `data_type` as the agent read them from the catalog. In `done`
        and in a stored turn each reference also says whether the answer `cited`
        it; a reference the answer did not cite gets no chip.
      properties:
        kind:
          $ref: '#/components/schemas/ChatReferenceKindEnum'
        handle:
          type: string
          description: 'The agent''s short name for the item: `A` (asset), `P` (passage)
            or `L` (a found place, on a `frame`) and a number. `A` and `P` are cited
            inline as `[A1]`.'
          pattern: ^[APL][1-9][0-9]{0,4}$
        cited:
          type: boolean
          description: 'In `done` and in stored turns: whether the answer cited this
            handle.'
        name:
          type: string
          description: The asset's name, as the agent read it.
        data_type:
          type: string
          description: The asset's data type, as the agent read it.
        asset_id:
          type: string
          format: uuid
          description: Every kind but `frame`.
        area:
          type: string
          nullable: true
          description: The polygon it was read for, as WKT, when it was a drawn area.
        bbox:
          type: array
          items:
            type: number
            format: double
          nullable: true
          description: '[min_lon, min_lat, max_lon, max_lat], SRID 4326.'
          maxItems: 4
          minItems: 4
        filter:
          allOf:
          - $ref: '#/components/schemas/ChatFilter'
          nullable: true
        total:
          type: integer
          minimum: 0
          nullable: true
          description: A layer's exact feature count inside its area, filter applied.
        chunk_id:
          type: string
          description: A passage's id in the chunk index.
        page:
          type: integer
          minimum: 1
          nullable: true
          description: A passage's first page, counted from 1.
        stats:
          nullable: true
          description: 'A raster''s figures as the answer used them: per band, or
            per class.'
      required:
      - kind
    ChatReferenceEvent:
      type: object
      description: Something the answer points to, as soon as a lookup found it.
      properties:
        event:
          allOf:
          - $ref: '#/components/schemas/ChatReferenceEventEventEnum'
          description: |-
            What this event is.

            * `reference` - reference
        reference:
          $ref: '#/components/schemas/ChatReference'
      required:
      - event
      - reference
    ChatReferenceEventEventEnum:
      enum:
      - reference
      type: string
      description: '* `reference` - reference'
    ChatReferenceKindEnum:
      enum:
      - asset
      - layer
      - passage
      - raster
      - frame
      type: string
      description: |-
        * `asset` - asset
        * `layer` - layer
        * `passage` - passage
        * `raster` - raster
        * `frame` - frame
    ChatSession:
      type: object
      description: One session, as the session list shows it.
