# Serves the built SPA inside the frontend container. This is the inner of two
# nginx layers: the host's nginx terminates TLS and routes /api, /admin/ and
# /django-static/ to the backend; everything it does not route arrives here.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is never cached: it is what points at the current asset
    # hashes, so a stale copy pins a browser to a deleted build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: /signin and /runs are React Router paths with no
    # file behind them, so anything unmatched falls through to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
